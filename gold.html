<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Trading Page</title>
    <script>
        async function fetchGoldPrice() {
            const response = await fetch('https://api.tcmb.gov.tr/../path/to/gold/endpoint'); // Update with actual endpoint
            const data = await response.json();
            const goldPrice = data['goldPrice']; // Update according to API response structure
            document.getElementById('gold-price').innerText = `Current Gold Price: ${goldPrice}`;
        }

        window.onload = fetchGoldPrice;
    </script>
</head>
<body>
    <h1>Gold Trading Page</h1>
    <div id="gold-price">Fetching gold price...</div>
</body>
</html>
